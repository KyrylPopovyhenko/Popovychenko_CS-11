<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    
    <div class="title">
        <div>A Trusted Reputation Built Over Time</div>
        <div>Sample text. Click to select the text box. Click again or double click to start editing the text.</div>
    </div>

    <div class="content">
        <div class="left">
            <img src="img/mans.jpg" alt="mans">
            <div class="bottom">
                <img src="img/engineer.jpg" alt="engineer">
                <div class="text-box">
                    <div>40+</div>
                    <div>Years Established</div>
                </div>
            </div>
        </div>

        <div class="right">
            <div class="top">
                <div class="text-box-inverted">
                    <div>10k</div>
                    <div>Completed Projects</div>
                </div>
                <img src="img/female.jpg" alt="female">
            </div>
            <img src="img/builder.jpg" alt="builder">
        </div>
    </div>

</body>
</html>
