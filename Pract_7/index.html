<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Calculators</title>
    <script src="script.js" defer></script>
</head>
<body>
    <section>
        <h2>Площа трикутника (формула Герона)</h2>

        <input type="number" id="sideA" placeholder="Сторона A" class="side">
        <input type="number" id="sideB" placeholder="Сторона B" class="side">
        <input type="number" id="sideC" placeholder="Сторона C" class="side">

        <button id="calculate">Розрахувати</button>

        <p id="result"></p>
    </section>
    <section>
        <h2>Площа трикутника за двома сторонами і кутом</h2>

        <input type="number" id="sideA2" placeholder="Сторона A" class="side2">
        <input type="number" id="sideB2" placeholder="Сторона B" class="side2">
        <input type="number" id="angle" placeholder="Кут у градусах" class="side2">

        <button id="calculate2">Розрахувати</button>

        <p id="result2"></p>
    </section>
    <section>
        <h2>Площа трикутника за стороною і висотою</h2>

        <input type="number" id="sideA3" placeholder="Сторона A" class="side2">
        <input type="number" id="height" placeholder="Висота H" class="side2">

        <button id="calculate3">Розрахувати</button>

        <p id="result3"></p>
    </section>
    <section>
        <h2>Площа трикутника за 3 сторонами і радіусом описаного кола</h2>

        <input type="number" id="sideA" placeholder="Сторона A" class="side3">
        <input type="number" id="sideB" placeholder="Сторона B" class="side3">
        <input type="number" id="sideC" placeholder="Сторона C" class="side3">
        <input type="number" id="radius" placeholder="Радіус R" class="radius">


        <button id="calculate4">Розрахувати</button>

        <p id="result4"></p>
    </section>
    <section>
        <h2>Перевірка на число-паліндром</h2>

        <input type="number" id="pali" placeholder="Число">

        <button id="calculate5">Перевірити</button>

        <p id="result5"></p>
    </section>
    <section>
        <h2>Перевірка на анаграму</h2>

        <input type="text" id="word" placeholder="Перше слово" class="word">
        <input type="text" id="word2" placeholder="Друге слово" class="word">

        <button id="calculate6">Перевірити</button>

        <p id="result6"></p>
    </section>
    <section>
        <h2>Число Фібоначі за кроком</h2>

        <input type="number" id="step" placeholder="Крок">

        <button id="calculate7">Перевірити</button>

        <p id="result7"></p>
    </section>
    <section>
        <h2>Перевірка числа у послідовності Фібоначі</h2>

        <input type="number" id="value" placeholder="Число">

        <button id="calculate8">Перевірити</button>

        <p id="result8"></p>
    </section>
</body>
</body>
</html>
