<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Forefathers</title>
</head>
<body>
    <section class="container">
        <header>
            <div class="text-header">
                <button type="button">WORK</button>
                <button type="button">EXPERTISE</button>
                <button type="button">SHORT STORIES</button>
                <button type="button">GOODS</button>
                <button type="button-media" class="button-media">HIRE US</button>
            </div>
            <img src="img/logo.svg" alt="Forefathers logo">
            <button type="button" class="project-button">START A PROJECT</button>        
        </header>
        <div class="main-text">
            <h1>FOREFATHERS</h1>
        </div>
        <div class="second">
            <h2>A PRONOUNCED WEB AGENCY ★ BUILDING FOR THE MODERN DEMAND</h2>
        </div>
        <footer>
            <div class="left-text">
                <h3>We're Forefathers Group,
                    <br>an agency of fortuitous
                    <br>gentleman carving a path
                    <br>through the digital
                    <br>landscape with knowledge
                    <br>and determination.</h3>
            </div>
            <div class="circle" aria-label="The new design frontier">
                <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <path id="circleText" d="M 65,65 m -51,0 a 51,51 0 1,1 102,0 a 51,51 0 1,1 -102,0" />
                    </defs>
                    <text fill="white" font-family="Arial, sans-serif" font-size="16" letter-spacing="3.4">
                        <textPath href="#circleText"> DESIGN FRONTIER THE NEW</textPath>
                    </text>
                    <path d="M65 52 V80 M59 74 L65 80 L71 74" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                </svg>
            </div>
            <div class="emblems">
                <img src="img/home-hero-emblems.png" alt="Forefathers emblems">
            </div>
        </footer>
    </section>
</body>
</html>
